name: build
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # 发布签名：密钥不在仓库里，构建前从 Secrets 还原。
      # 没配这些 secret 时（比如 fork 出去）build.gradle.kts 会退回默认 debug 签名，构建照样能过。
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/talktact.p12
          echo "keystore 已从 Secrets 还原（$(wc -c < keystore/talktact.p12) 字节）"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # libxposed api/service 102 的 AAR 声明了 minCompileSdk=37，runner 上要有平台 37。
      # 这里直接调 sdkmanager 而不走 android-actions/setup-android：那个 action 会去装
      # 「tools」包，而它在新版 SDK 仓库里已被移除，于是整步直接失败。我们只需要平台本身。
      - name: install Android platform 37
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # API 37 是「带次版本号」的平台（Android 16 起引入 minor SDK），
          # 没有名为 android-37 的包，只有 android-37.0 / .1 / .2
          "$SDKMANAGER" --install "platforms;android-37.0" "platforms;android-37.1"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      # 纯逻辑层的单元测试（不依赖 Android SDK，几秒钟）
      - name: unit test
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: build apk
        run: gradle :app:assembleDebug --no-daemon
      # 现代 API 的「我是模块」全写在这三个文件上，缺一个框架就不认它（列表里都不出现）。
      # 反过来，残留 legacy 的 assets/xposed_init 会让框架按老模块处理 —— 那就是白迁了。
      - name: verify module metadata
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "检查 $APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          for f in META-INF/xposed/module.prop META-INF/xposed/java_init.list META-INF/xposed/scope.list; do
            if ! grep -q "$f" /tmp/apk-list.txt; then echo "缺少 $f"; exit 1; fi
          done
          if grep -q "assets/xposed_init" /tmp/apk-list.txt; then echo "仍残留 legacy assets/xposed_init"; exit 1; fi
          echo "modern 元数据齐全，且无 legacy 残留"
      # 签名必须是真的：签不上或退回默认 debug key，用户升级就会 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
      # 顺便把 sha256 打进日志，发 release 时抄它。
      - name: verify apk signature
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "apk：$APK"
          echo "sha256：$(sha256sum "$APK" | cut -d' ' -f1)"
          ENTRY=$(unzip -Z1 "$APK" | grep -iE '^META-INF/.*\.(RSA|DSA|EC)$' | head -1 || true)
          if [ -z "$ENTRY" ]; then
            echo "::error::APK 没有 v1 签名（找不到 META-INF/*.RSA）"
            exit 1
          fi
          echo "签名条目：$ENTRY"
          unzip -p "$APK" "$ENTRY" | openssl pkcs7 -inform DER -print_certs 2>/dev/null \
            | openssl x509 -noout -subject -fingerprint -sha256
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
