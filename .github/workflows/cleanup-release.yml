name: cleanup-release

# 一次性工具：用 MODULE_REPO_TOKEN 删掉模块仓库里过时的 release。
#
# 为什么需要它：Xposed-Modules-Repo 组织开了「OAuth 应用访问限制」，
# 普通 OAuth 应用（含网页端登录用的那种）拿不到那个仓库的写权限，只有 PAT 不受限制
# —— 也就是这个 secret。所以删 release 这种事只能借 workflow 跑。
# 删完就把这个文件删掉（它只是把一条命令搬进 CI，没有别的用途）。
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 目标仓库
        required: true
        default: Xposed-Modules-Repo/io.github.shibry88_netizen.talktact
      tag:
        description: 要删除的 release tag
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: delete release
        env:
          GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
        run: |
          set -e
          echo "将删除 ${{ inputs.repo }} 的 release：${{ inputs.tag }}"
          gh release view "${{ inputs.tag }}" -R "${{ inputs.repo }}" --json tagName,name,assets \
            --jq '{tag:.tagName,name:.name,assets:[.assets[].name]}'
          gh release delete "${{ inputs.tag }}" -R "${{ inputs.repo }}" --yes --cleanup-tag
          echo "已删除"
          gh release list -R "${{ inputs.repo }}" --limit 10
